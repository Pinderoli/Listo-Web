<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listo Web</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8;
      --fg: #1a1a1a;
      --accent: #2f6feb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --fg: #f0f0f0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 480px; }
    h1 {
      font-size: 2.25rem;
      margin-bottom: 0.5rem;
    }
    h1 span { color: var(--accent); }
    p {
      font-size: 1.1rem;
      opacity: 0.75;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hi <span>Sam</span></h1>
    <p>This is a placeholder page confirming GitHub Pages is set up. The real app comes next.</p>
  </main>
</body>
</html>

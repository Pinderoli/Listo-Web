<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listo</title>
  <meta name="description" content="Make, reset, and share repeatable checklists.">
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="logo">Listo</h1>
      <div class="header-actions">
        <button id="importBtn" class="btn btn-ghost">Import</button>
        <button id="newListBtn" class="btn btn-primary">+ New List</button>
      </div>
    </header>

    <div class="layout">
      <nav id="listNav" class="list-nav"></nav>
      <main id="listView" class="list-view"></main>
    </div>

    <input type="file" id="importInput" accept="application/json,.json" hidden>
  </div>

  <script src="app.js?v=12" defer></script>
</body>
</html>
